<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>محضر اجتماع - مدارس البيارق الأهلية</title>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box}
:root{--green:#08765d;--gold:#cba243;--red:#8e1717;--ui:#182532}
html,body{margin:0;background:#dfe3e7;font-family:Tahoma,Arial,sans-serif}
.editor{position:sticky;top:0;z-index:50;background:var(--ui);color:#fff;padding:7px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;direction:rtl;box-shadow:0 2px 8px #0005}
.editor button,.editor select,.editor input[type=number],.editor input[type=color]{height:34px;border:0;border-radius:6px;padding:0 9px;background:#fff;color:#111}
.editor button{font-weight:700;cursor:pointer} .editor .primary{background:#0c8a5b;color:#fff}
.editor .danger{background:#a62d2d;color:#fff} .editor .dark{background:#34495e;color:#fff}
.editor input[type=number]{width:64px} .editor input[type=color]{width:42px;padding:3px}
.sep{width:1px;height:26px;background:#ffffff45;margin:0 2px}
.viewport{overflow:auto;width:100%;height:calc(100vh - 52px);padding:18px}
.paper-wrap{width:max-content;margin:auto}
.page{width:210mm;height:297mm;position:relative;background:white;overflow:hidden;transform-origin:top center;box-shadow:0 4px 20px #0004}
.stationery{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none}
.content{position:absolute;z-index:2;top:31mm;right:11mm;left:11mm;bottom:22mm}
.meeting-title{text-align:center;font-size:19px;font-weight:900;margin-bottom:2mm}
.meta{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.meta td{border:1px solid #333;text-align:center;padding:1.4mm;height:10mm;font-weight:700}
.meta .edit{font-size:13px}
.edit{min-height:5mm;outline:none} .edit:focus{background:#fff4b8}
.section{margin-top:2mm}
.section-head{display:flex;align-items:center;gap:5px}
.section h2{color:var(--red);font-size:19px;margin:0;font-weight:900;flex:1}
.rowBtns{display:flex;gap:3px} .rowBtns button{border:0;border-radius:4px;font-size:11px;padding:3px 7px;cursor:pointer}
.add{background:#dff4e8} .remove{background:#f8dddd}
.dynamic-list{margin:1mm 0 0;padding-right:8mm;font-size:13px}
.dynamic-list li{min-height:6mm;padding:1mm 1mm 1mm 0;position:relative}
.dynamic-list li .edit{display:block;min-height:4.8mm}
.attendees-title{color:var(--red);font-weight:900;font-size:17px;margin:1mm 0}
.attendees{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.attendees th,.attendees td{border:1px solid #333;height:8mm;text-align:center;padding:1mm}
.attendees .name{width:36%} .attendees .sign{width:14%}
.resize-handle{display:inline-block;font-size:11px;background:#edf2f5;border:1px solid #bbc5cb;border-radius:4px;padding:2px 5px;cursor:pointer;color:#333;margin-right:4px}
.logo-mini{position:absolute;top:1mm;right:2mm;width:0;height:0;overflow:hidden}
.status{font-size:11px;opacity:.85}
@media print{
 html,body{width:210mm;height:297mm;background:#fff}
 .editor{display:none!important} .viewport{padding:0;overflow:visible;height:auto}
 .paper-wrap{margin:0} .page{box-shadow:none;transform:none!important;margin:0}
 .rowBtns,.resize-handle{display:none!important} .edit:focus{background:transparent}
}
</style></head>
<body>
<div class="editor">
 <button class="primary" onclick="window.print()">🖨 طباعة A4</button>

<script>
let sc=1, history=[], future=[];
function snapshot(){history.push(document.querySelector('.content').innerHTML);if(history.length>30)history.shift();future=[]}
function undo(){if(!history.length)return;future.push(document.querySelector('.content').innerHTML);document.querySelector('.content').innerHTML=history.pop();bind();save()}
function redo(){if(!future.length)return;history.push(document.querySelector('.content').innerHTML);document.querySelector('.content').innerHTML=future.pop();bind();save()}
function cmd(c,v=null){document.execCommand(c,false,v);save()}
function setFontSize(px){document.execCommand('fontSize',false,7);document.querySelectorAll('font[size="7"]').forEach(x=>{x.removeAttribute('size');x.style.fontSize=px+'px'});save()}
function zoom(n){sc=Math.max(.55,Math.min(1.7,sc+n));applyZoom()}
function applyZoom(){page.style.transform=`scale(${sc})`;wrap.style.width=(210*sc)+'mm';wrap.style.height=(297*sc)+'mm';zoomLabel.textContent=Math.round(sc*100)+'%'}
function fit(){let mm=96/25.4;sc=Math.min(1,(viewport.clientWidth-36)/(210*mm));applyZoom()}
function mkLine(text=''){let li=document.createElement('li');li.innerHTML=`<span class="edit" contenteditable="true">${text}</span>`;return li}
function addLine(id){snapshot();document.getElementById(id).appendChild(mkLine());bind();save()}
function removeLine(id){let x=document.getElementById(id);if(x.lastElementChild){snapshot();x.lastElementChild.remove();save()}}
function addAttendee(){snapshot();let tr=document.createElement('tr');tr.innerHTML='<td class="edit" contenteditable="true"></td><td></td><td class="edit" contenteditable="true"></td><td></td>';attendees.appendChild(tr);bind();save()}
function removeAttendee(){if(attendees.lastElementChild){snapshot();attendees.lastElementChild.remove();save()}}
function bind(){document.querySelectorAll('.edit').forEach(e=>{e.onfocus=()=>{e.dataset.before=e.innerHTML};e.onblur=()=>{if(e.dataset.before!==e.innerHTML)snapshot();save()};e.oninput=save})}
function save(){localStorage.setItem('bayariq_meeting_v2',document.querySelector('.content').innerHTML)}
let saved=localStorage.getItem('bayariq_meeting_v2');
if(saved) document.querySelector('.content').innerHTML=saved;
else{for(let i=0;i<7;i++)goals.appendChild(mkLine());for(let i=0;i<11;i++)actions.appendChild(mkLine());for(let i=0;i<5;i++)addAttendee()}
bind();applyZoom();
</script></body></html>
